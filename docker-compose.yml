version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: handover_ai_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: handover_ai
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: handover_user
      MYSQL_PASSWORD: handover_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
