spring.application.name=handover-ai
server.port=${SERVER_PORT:8080}

# Session / cookie hardening. Set SESSION_COOKIE_SECURE=true when serving over HTTPS.
server.servlet.session.timeout=${SESSION_TIMEOUT_MINUTES:60}m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Database settings. H2 is the zero-setup demo default; MySQL is supported through env vars.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:handover_ai;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart file upload limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# HandOver.AI Application Settings
handoverai.mock-ai=${MOCK_AI_MODE:true}
handoverai.llm.api-key=${LLM_API_KEY:mock-key}
handoverai.llm.endpoint=${LLM_API_ENDPOINT:https://api.openai.com/v1/chat/completions}
handoverai.llm.model=${LLM_MODEL:gpt-4o}
handoverai.face-login-enabled=${FACE_LOGIN_ENABLED:true}
handoverai.security.encryption-key=${APP_ENCRYPTION_KEY:HandOverAiSuperSecretAES256Key!}
handoverai.security.max-failed-attempts=${MAX_LOGIN_ATTEMPTS:5}
handoverai.security.lockout-minutes=${LOCKOUT_DURATION_MINUTES:15}
handoverai.upload-dir=${UPLOAD_DIR:./uploads}

# Logging
logging.level.com.handoverai=INFO
logging.level.org.springframework.security=WARN
