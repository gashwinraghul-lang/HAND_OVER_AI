<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - HandOver.AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="animated-bg">
    <div class="login-wrapper">
        <div class="glass-card login-card" style="max-width:520px;">
            <div class="text-center mb-4">
                <h2 class="fw-800">Create Account</h2>
                <p class="text-muted mb-0">Join HandOver.AI</p>
            </div>

            <div class="mb-3">
                <label class="form-label" for="signupName">Full Name</label>
                <input type="text" class="form-control" id="signupName" placeholder="John Doe" autocomplete="name">
            </div>
            <div class="mb-3">
                <label class="form-label" for="signupEmail">Work Email</label>
                <input type="email" class="form-control" id="signupEmail" placeholder="you@company.com" autocomplete="email">
            </div>
            <div class="mb-3">
                <label class="form-label" for="signupPassword">Password (min 12 characters)</label>
                <input type="password" class="form-control" id="signupPassword" placeholder="Enter secure password"
                       autocomplete="new-password" oninput="updatePasswordHint()">
                <div class="form-text" id="passwordHint">Use at least 12 characters.</div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="signupPasswordConfirm">Confirm Password</label>
                <input type="password" class="form-control" id="signupPasswordConfirm" placeholder="Repeat password"
                       autocomplete="new-password" onkeypress="if(event.key==='Enter') doSignup()">
            </div>
            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="consentFace">
                    <label class="form-check-label small" for="consentFace">
                        I consent to optional face recognition enrolment. I can enrol or delete my face data later in Profile.
                    </label>
                </div>
            </div>
            <button class="btn btn-teal w-100 mb-3" id="signupBtn" onclick="doSignup()">
                <i class="bi bi-person-plus me-1"></i> Create account
            </button>

            <div class="text-center">
                <a href="login.html" class="text-brand">Already have an account? Login</a>
            </div>
            <div class="text-center mt-2">
                <a href="index.html" class="text-muted small"><i class="bi bi-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        initTheme();
        ensureCsrf();

        function updatePasswordHint() {
            const pw = document.getElementById('signupPassword').value;
            const hint = document.getElementById('passwordHint');
            if (pw.length === 0) {
                hint.textContent = 'Use at least 12 characters.';
                hint.className = 'form-text';
            } else if (pw.length < 12) {
                hint.textContent = `${12 - pw.length} more character${12 - pw.length === 1 ? '' : 's'} needed.`;
                hint.className = 'form-text text-warning';
            } else {
                hint.textContent = 'Password length looks good.';
                hint.className = 'form-text text-success';
            }
        }

        async function doSignup() {
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupPasswordConfirm').value;

            if (!name || !email || !password) {
                showToast('Please fill in your name, email and password.', 'warning');
                return;
            }
            if (password.length < 12) {
                showToast('Password must be at least 12 characters', 'warning');
                return;
            }
            if (password !== confirm) {
                showToast('Passwords do not match.', 'warning');
                return;
            }

            const btn = document.getElementById('signupBtn');
            btn.disabled = true;
            try {
                await api('/api/auth/signup', { method: 'POST', body: { name, email, password } });
                showToast('Account created. Signing you in…', 'success');
                try {
                    await api('/api/auth/login', { method: 'POST', body: { email, password } });
                    setTimeout(() => window.location.href = 'dashboard.html', 700);
                } catch (_) {
                    setTimeout(() => window.location.href = 'login.html', 1200);
                }
            } catch (e) {
                showToast(errorText(e), 'error');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
